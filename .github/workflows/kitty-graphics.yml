name: Kitty Graphics

on:
  push:
    paths:
      - ".github/workflows/kitty-graphics.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "zellij-client/src/stdin_handler.rs"
      - "zellij-server/src/panes/grid.rs"
      - "zellij-server/src/panes/terminal_pane.rs"
      - "zellij-server/src/panes/kitty_graphics/**"
      - "zellij-server/src/panes/unit/grid_tests.rs"
      - "zellij-server/src/panes/unit/terminal_pane_tests.rs"
      - "zellij-server/src/screen.rs"
      - "zellij-server/src/unit/screen_tests.rs"
  pull_request:
    paths:
      - ".github/workflows/kitty-graphics.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "zellij-client/src/stdin_handler.rs"
      - "zellij-server/src/panes/grid.rs"
      - "zellij-server/src/panes/terminal_pane.rs"
      - "zellij-server/src/panes/kitty_graphics/**"
      - "zellij-server/src/panes/unit/grid_tests.rs"
      - "zellij-server/src/panes/unit/terminal_pane_tests.rs"
      - "zellij-server/src/screen.rs"
      - "zellij-server/src/unit/screen_tests.rs"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  kitty-icat-smoke:
    name: Kitty icat smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Install kitty and xvfb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends kitty xvfb

      - name: Build zellij
        run: |
          set -euo pipefail
          cargo xtask build
          zellij_bin="$(find target -type f -name zellij -perm -111 | head -n1)"
          if [ -z "$zellij_bin" ]; then
            echo "Could not find built zellij binary under target/"
            exit 1
          fi
          echo "ZELLIJ_BIN=$zellij_bin" >> "$GITHUB_ENV"

      - name: Verify kitty icat inside zellij
        run: |
          set -euo pipefail
          mkdir -p target/kitty-ci
          cp assets/logo.png target/kitty-ci/smoke.png
          cat > target/kitty-ci/check_icat.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -f target/kitty-ci/icat.ok target/kitty-ci/check_icat.inner.log
          exec > target/kitty-ci/check_icat.inner.log 2>&1
          set -x
          "$ZELLIJ_BIN" --session kitty-icat-ci run -- sh -lc '
            set -euo pipefail
            sleep 1
            kitty +kitten icat --detect-support target/kitty-ci/smoke.png
            kitty +kitten icat target/kitty-ci/smoke.png
          '
          touch target/kitty-ci/icat.ok
          SH
          chmod +x target/kitty-ci/check_icat.sh
          set +e
          timeout 180s xvfb-run -a -s "-screen 0 1280x800x24" kitty --config NONE sh -lc "target/kitty-ci/check_icat.sh" 2>&1 | tee target/kitty-ci/icat.log
          run_status=${PIPESTATUS[0]}
          set -e
          if [ -f target/kitty-ci/check_icat.inner.log ]; then
            cat target/kitty-ci/check_icat.inner.log | tee -a target/kitty-ci/icat.log
          fi
          if [ "$run_status" -ne 0 ]; then
            exit "$run_status"
          fi
          test -f target/kitty-ci/icat.ok

      - name: Upload icat log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kitty-icat-log
          path: target/kitty-ci/icat.log
